name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kotobase-protocols-worker
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/kotobase-protocols
          path: kotobase-protocols
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/kotobase
          # Same pin as kotobase-protocols' deps.edn.
          ref: bbf57df9dde5c1869182012860129a598382e088
          path: kotobase
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/kotobase-client
          path: kotobase-client
      # Real datom-plane engine dep chain (ADR-2607177500) — same
      # sibling-checkout pattern kotobase-cljc-worker itself uses.
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/kotobase-peer
          path: kotobase-peer
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/datom
          path: datom
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/arrangement
          path: arrangement
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/prolly-tree
          path: prolly-tree
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/chain
          path: chain
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/io-ipld
          path: io-ipld
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/io-multiformats
          path: io-multiformats
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/org-ietf-cbor
          path: org-ietf-cbor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global nbb
      - name: nbb tests (pure shell logic)
        working-directory: kotobase-protocols-worker
        run: nbb --classpath "src:test:../kotobase-protocols/src:../kotobase/src" bin/run_tests.cljs
      - name: lint engine calls (async-get-fn guardrail, kotoba-lang/kotobase-protocols-worker#1)
        working-directory: kotobase-protocols-worker
        run: nbb bin/lint_engine_calls.cljs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: npm install (CACAO verify + the real engine need @noble/curves,
              @noble/hashes, @ipld/dag-cbor)
        working-directory: kotobase-protocols-worker
        run: npm ci
      - name: node-test (CACAO real-crypto verify + datom-store ≡ LocalStore,
              ADR-2607177000/2607177500)
        working-directory: kotobase-protocols-worker
        run: |
          npx shadow-cljs compile test
          node out/node-tests.js
      - name: shadow-cljs release build
        working-directory: kotobase-protocols-worker
        run: npx shadow-cljs release worker
